"$schema" = 'https://starship.rs/config-schema.json'

# Minimal theme - just essentials
format = """
$directory\
$git_branch\
$character"""

[directory]
style = "bold fg:blue"
format = '[$path]($style) '
truncation_length = 4

[git_branch]
symbol = " "
style = "fg:green"
format = '[$symbol$branch]($style) '

[character]
success_symbol = '[›](bold fg:green)'
error_symbol = '[›](bold fg:red)'
