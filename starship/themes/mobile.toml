"$schema" = 'https://starship.rs/config-schema.json'

# Mobile Development theme (iOS/Android)
palette = 'catppuccin_macchiato'

format = """
[](blue)\
$os\
[](bg:green fg:blue)\
$username\
[](bg:peach fg:green)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$](fg:yellow bg:lavender)\
$swift\
$kotlin\
$java\
$dart\
[ ](fg:lavender)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:blue fg:crust"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"

[username]
show_always = true
style = "bg:green fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = '[ $path ]($style)'

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[swift]
symbol = "🍎"
style = "bg:lavender"
format = '[[ $symbol( $version) ](fg:crust bg:lavender)]($style)'

[kotlin]
symbol = "🅺"
style = "bg:lavender"
format = '[[ $symbol( $version) ](fg:crust bg:lavender)]($style)'

[java]
symbol = "☕"
style = "bg:lavender"
format = '[[ $symbol( $version) ](fg:crust bg:lavender)]($style)'

[dart]
symbol = "🎯"
style = "bg:lavender"
format = '[[ $symbol( $version) ](fg:crust bg:lavender)]($style)'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:yellow)'

[line_break]
disabled = false

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
