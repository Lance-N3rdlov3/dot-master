# Tmux extensions - Additional useful commands

# Copy mode improvements
set -g @copy_use_osc52_fallback 'on'

# Session management with custom layouts
bind -T prefix K new-window -c "#{pane_current_path}" -n 'main' 'tmux split-window -h -p 30 && tmux split-window -v -p 50'
bind -T prefix L new-window -c "#{pane_current_path}" -n 'dev' 'tmux split-window -v -p 20 && tmux select-pane -t 0 && tmux split-window -h'

# Fuzzy search sessions
bind -T prefix C-f display-popup -E '[[ -n "$(command -v fzf)" ]] && {
    s=$(tmux list-sessions -F "#{session_name}" | fzf --height=40% --reverse --prompt="Session: ") || return
    [[ -n "$s" ]] && tmux switch-client -t "$s"
} || tmux display-message "fzf not found"'

# Quick pane zoom
bind -T prefix Z resize-pane -Z

# Pane navigation with numbers
bind -T prefix 1 select-pane -t 1
bind -T prefix 2 select-pane -t 2
bind -T prefix 3 select-pane -t 3
bind -T prefix 4 select-pane -t 4

# Sync panes (send to all panes in window)
bind -T prefix S set-window synchronize-panes

# Log current pane
bind -T prefix P pipe-pane 'cat > $HOME/tmux-#{window_id}-#{pane_id}-$(date +%Y%m%d%H%M%S).log'

# Git integration - show git log in popup
bind -T prefix G display-popup -E 'tmux send-keys "git log --oneline --graph --decorate" && tmux send-keys Enter'

# Project-specific layouts
bind -T prefix p run-shell 'tmuxp -l'

# Better copy to clipboard (supports both Linux and macOS)
if-shell 'command -v reattach-to-user-namespace' 'set -g default-command "reattach-to-user-namespace -l $SHELL"'
if-shell 'command -v pbcopy' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v xclip' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# Weather popup
bind -T prefix W run-shell 'curl -s wttr.in | head -n -7 | tmux display-popup -h 20 -w 60 -E cat'

# Toggle mouse mode
bind -T prefix M set-option -g mouse \; display-message "Mouse $(tmux show-option -g mouse | cut -d\" \" -f2)"'

# Open file in editor
bind -T prefix o run-shell 'tmux send-keys "${EDITOR:-nvim} $(fzf)" && tmux send-keys Enter'
